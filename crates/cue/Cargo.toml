[package]
name = "cue"
version = "0.3.2"
description = "A terminal text editor built on OpenTUI's native core"
edition.workspace = true
license.workspace = true

[dependencies]
opentui = { path = "../opentui" }
libc = "0.2"
ignore = "0.4"
nucleo-matcher = "0.3"
grep-searcher = "0.1.17"
grep-regex = "0.1.14"
grep-matcher = "0.1.9"
memchr = "2"
tree-sitter = "0.27"
tree-sitter-bash = "0.25"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-css = "0.25"
tree-sitter-go = "0.25"
tree-sitter-html = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-json = "0.24"
tree-sitter-md = "0.5"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-toml-ng = "0.7"
tree-sitter-typescript = "0.23"
tree-sitter-yaml = "0.7"
tree-sitter-zig = "1.1"
tree-sitter-asm = "0.24"
tree-sitter-cmake = "0.7"
tree-sitter-elixir = "0.3"
tree-sitter-glsl = "0.2"
tree-sitter-haskell = "0.23"
tree-sitter-java = "0.23"
tree-sitter-make = "1.1"
tree-sitter-nginx = "1.0"
tree-sitter-php = "0.24"
tree-sitter-powershell = "0.26"
tree-sitter-r = "1.3"
tree-sitter-requirements = "0.6"
tree-sitter-ruby = "0.23"
tree-sitter-scheme = "0.24"
tree-sitter-sequel = "0.3"
tree-sitter-svelte-ng = "1.0"
tree-sitter-swift = "0.7"
tree-sitter-gdscript = { git = "https://github.com/PrestonKnopp/tree-sitter-gdscript", rev = "9686853b696db07118ad110e440d6de0ca6498b4" }
# arborium packages these grammars' canonical repos, where their own crates
# are stale or depend on an older tree-sitter.
arborium-clojure = "2.18"
arborium-commonlisp = "2.18"
arborium-dart = "2.18"
arborium-diff = "2.18"
arborium-dockerfile = "2.18"
arborium-graphql = "2.18"
arborium-kotlin = "2.18"
arborium-perl = "2.18"
arborium-typst = "2.18"
arborium-vim = "2.18"
tree-sitter-bibtex = { git = "https://github.com/latex-lsp/tree-sitter-bibtex", rev = "8d04ed27b3bc7929f14b7df9236797dab9f3fa66" }
tree-sitter-latex = { package = "tree-sitter-latex-vendored", path = "../../vendor/tree-sitter-latex" }
tree-sitter-mermaid = { package = "tree-sitter-mermaid-vendored", path = "../../vendor/tree-sitter-mermaid" }
trash = "5"
notify = "8.2.0"
toml = { version = "1.1.6", features = ["preserve_order"] }
pulldown-cmark = { version = "0.13", default-features = false }
unicode-width = "0.2"
# Math in reader mode: KaTeX's parser and layout, ported to Rust, and a
# rasterizer for what it lays out.
ratex-parser = "0.1.14"
ratex-layout = "0.1.14"
ratex-types = "0.1.14"
ratex-font = "0.1.14"
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
ttf-parser = "0.25"
# Diff mode: line diffs, and which words in a changed line changed.
similar = { version = "3", features = ["inline"] }


# musl's allocator is slow under contention (parallel search, file indexing).
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = "0.1"
