[workspace]
resolver = "2"
members = ["crates/opentui-sys", "crates/opentui", "crates/cue"]

[workspace.package]
edition = "2021"
license = "MIT"

# Full DWARF made target/debug grow by gigabytes per build; backtraces keep file:line.
[profile.dev]
debug = "line-tables-only"

# Distributed binaries (deployment/build.sh); plain `release` stays fast to build.
[profile.dist]
inherits = "release"
lto = true
codegen-units = 1
# Symbol names stay, for crash reports' backtraces.
strip = "debuginfo"
